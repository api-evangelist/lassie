aid: lassie
name: Lassie
description: >-
  Lassie is a Swedish insurtech that sells preventive digital pet insurance for dogs and cats.
  Founded in Stockholm in 2020, the company pairs veterinary-care cover with an app-based
  prevention programme: owners take courses designed by animal experts and earn up to SEK 500 a
  year off their premium. Cover includes unlimited digital vet consultations through FirstVet,
  24-hour claims handling, direct settlement with clinics, no breed or age restrictions and no
  lock-in period. Lassie AB is an insurance intermediary supervised by Finansinspektionen under
  the Swedish Insurance Distribution Act (2018:1219); policies are underwritten by Dina
  Forsakring AB. The company operates in Sweden, Germany and France with 100+ staff and more than
  one million insured animals, and is backed by a16z and Balderton Capital. Lassie publishes no
  public developer API - its GraphQL backend at api.lassie.co is private to its own apps - but it
  does publish a per-market llms.txt, making it an early example of a consumer insurer building an
  agent-readable surface without an API programme.
